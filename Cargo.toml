[package]
name = "detune"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
ratatui-image = "4"
rustfft = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

